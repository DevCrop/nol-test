<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블루스퀘어 · 관리자 접속 확인</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202124;font-family:Arial,"Malgun Gothic",sans-serif}
    .notice{margin:0;padding:16px 24px;background:#fff3cd;color:#664d03;text-align:center;line-height:1.6;font-size:14px}
    main{max-width:460px;margin:56px auto;padding:0 24px}.logo{text-align:center;margin-bottom:28px}.logo img{max-width:160px;max-height:56px;object-fit:contain}
    .card{padding:36px 32px;background:#fff;border:1px solid #e3e6eb;border-radius:16px;box-shadow:0 8px 24px #20212408}
    h1{margin:0 0 12px;text-align:center;font-size:26px;letter-spacing:-1px}.description{margin:0 0 28px;text-align:center;color:#686d75;font-size:14px;line-height:1.6}
    fieldset{border:0;margin:0;padding:0;min-width:0}.field{margin-bottom:20px}label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}
    input{width:100%;height:48px;padding:0 14px;border:1px solid #d6dbe2;border-radius:8px;font:inherit;background:#f8f9fb;color:#666}
    input::placeholder{color:#9ba1ab}.captcha{display:flex;gap:12px;align-items:center}.captcha span{white-space:nowrap;font-size:13px;color:#7b8089}
    button{width:100%;min-height:48px;border:0;border-radius:8px;background:#222;color:#fff;font:inherit;font-weight:600;opacity:.5;cursor:not-allowed}
    .help{margin:20px 0 0;text-align:center;font-size:13px;color:#737982}.help a{color:inherit}footer{text-align:center;color:#8b9098;font-size:12px;margin:28px 0}
    @media(max-width:480px){main{margin-top:32px;padding:0 16px}.card{padding:28px 22px}h1{font-size:24px}}
  </style>
</head>
<body>
  <p class="notice" role="alert">HTTP 접속 확인용 화면입니다. SSL 설치 및 운영 전환 전에는 로그인과 관리자 작업을 사용할 수 없습니다.</p>
  <main>
    <div class="logo"><img src="/index.php/resource/images/admin/logo.png" alt="나인원랩스"></div>
    <section class="card" aria-labelledby="login-title">
      <h1 id="login-title">사이트 관리 시스템</h1>
      <p class="description">블루스퀘어 관리자 접속이 확인되었습니다.<br>인증 기능은 운영 전환 후 사용할 수 있습니다.</p>
      <form id="login_form" method="post" action="/index.php/lib/login/login.process.php" autocomplete="off">
        <fieldset disabled>
          <div class="field"><label for="uid">아이디</label><input id="uid" name="uid" placeholder="아이디" autocomplete="off"></div>
          <div class="field"><label for="upwd">비밀번호</label><input type="password" id="upwd" name="upwd" placeholder="비밀번호" autocomplete="off"></div>
          <div class="field"><label for="r_captcha">보안코드</label><div class="captcha"><span>SSL 설치 후 사용</span><input id="r_captcha" name="r_captcha" placeholder="보안코드" inputmode="numeric"></div></div>
          <button type="submit">로그인</button>
        </fieldset>
      </form>
      <p class="help">비밀번호 분실 시 고객센터 <a href="tel:02-951-9154">02-951-9154</a></p>
    </section>
    <footer>Copyright © nineonelabs.co.kr All rights reserved.</footer>
  </main>
</body>
</html>
