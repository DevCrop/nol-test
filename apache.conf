ServerName localhost
# Alias paths bypass the public document root's .htaccess rules.
<LocationMatch "(?i)^/resource/vendor/(?:fullPage\.js-2\.9\.7/(?:examples|tests)|tinymce/plugins/(?:example|jbimages))(?:/|$)">
    Require all denied
</LocationMatch>

<VirtualHost *:80>
    ServerName localhost
    ServerAlias gate.local gate.noltheater-daehakro.com
    DocumentRoot /var/www/html
    LimitRequestBody 115343360
    PassEnv GATE_ENFORCE
    PassEnv GATE_HOST
    PassEnv GATE_ROUTE_MODE
    PassEnv CORS_ORIGINS

    <Directory /var/www/html>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
