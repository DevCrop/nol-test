ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    LimitRequestBody 115343360
    PassEnv APP_ENV PUBLIC_HOST GATE_HOST GATE_ENFORCE GATE_ALLOW_IPS TRUSTED_PROXY_CIDRS CORS_ORIGINS

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /var/www/html/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
        php_flag engine off
        <FilesMatch "\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

