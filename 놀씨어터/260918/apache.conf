<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    LimitRequestBody 115343360
    PassEnv GATE_ENFORCE
    PassEnv GATE_HOST
    PassEnv CORS_ORIGINS

    <Directory /var/www/html>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName gate.local
    ServerAlias gate.local:8618
    DocumentRoot /var/www/html/nol-gate
    LimitRequestBody 115343360
    PassEnv GATE_ENFORCE
    PassEnv GATE_HOST
    PassEnv CORS_ORIGINS

    Alias /resource/vendor /var/www/html/resource/vendor
    Alias /resource/images /var/www/html/resource/images
    Alias /captcha /var/www/html/captcha
    Alias /uploads /var/www/html/uploads

    <Directory /var/www/html>
        AllowOverride None
    </Directory>
    <Directory /var/www/html/nol-gate>
        DirectoryIndex index.php index.html
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /var/www/html/resource>
        Require all granted
    </Directory>
    <Directory /var/www/html/captcha>
        Require all granted
    </Directory>
    <Directory /var/www/html/uploads>
        Require all granted
        php_flag engine off
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
