ServerName localhost
# QA-only HTTPS simulation; not a production configuration or TLS certificate test.
SetEnvIf X-QA-HTTPS "^1$" HTTPS=on
<VirtualHost *:80>
    ServerName localhost
    ServerAlias gate.bluesquare.kr gate.noltheater-daehakro.com
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride None
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.php
        Require all granted
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <LocationMatch "^/(?:inc|config|sql|qa|storage)(?:/|$)">
        Require all denied
    </LocationMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
