ServerName localhost
<VirtualHost *:80>
    ServerName localhost
    ServerAlias gate.local gate.noltheater-daehakro.com gate.bluesquare.kr blue-gate.qa.local
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride None
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.php
        Require all granted
    </Directory>
    # Host-level protections are separate from PHP routing.
    <FilesMatch "(?i)^(?:\\.|.*\\.(?:sql|log|md|bak|old|env|json|yml))">
        Require all denied
    </FilesMatch>
    <LocationMatch "(?i)^/(?:inc|src|config|bootstrap|routes|sql|qa|storage|uploads/request)(?:/|$)">
        Require all denied
    </LocationMatch>
    <Directory /var/www/html/uploads>
        php_flag engine off
        <FilesMatch "(?i)\\.(?:php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
